name: Feature request
description: Suggest a product, protocol, UX, or ops improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Protocol/backend
        - Web client
        - Windows client
        - Shared Rust core
        - Groups/channels
        - Media/calls
        - Deploy/Ops
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user pain does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior and any protocol/storage impact.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy notes
      description: Mention any plaintext, metadata, key, upload, or logging concerns.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Backend contract documented
        - Web and Windows behavior match
        - Tests added
