name: Bug report
description: Report a reproducible Messk bug.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please avoid sharing private keys, seed phrases, tokens, message plaintext, or production credentials.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend
        - Web client
        - Windows client
        - Shared Rust core
        - Deploy/Ops
        - Documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create/import account
        2. Open chat with ...
        3. Send ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact keys, tokens, seed phrases, and plaintext.
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: commit SHA, release version, or build date
