name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  release-preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - shell: pwsh
        run: ./scripts/release-preflight.ps1 -BackendOrigin http://localhost:8080 -AllowLocalhost

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mess
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: mess/go.mod
          cache-dependency-path: mess/go.sum
      - run: go test ./...

  backend-docker:
    name: Backend Docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mess
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config
      - run: docker build -t e2ee-messenger-backend:ci .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: messk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: messk/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  windows-client:
    name: Native Windows Client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Core fmt
        run: cargo fmt --manifest-path clients/core/Cargo.toml --check
      - name: Core tests
        run: cargo test --manifest-path clients/core/Cargo.toml
      - name: Core clippy
        run: cargo clippy --manifest-path clients/core/Cargo.toml -- -D warnings
      - name: Windows fmt
        run: cargo fmt --manifest-path clients/windows/Cargo.toml --check
      - name: Windows tests
        run: cargo test --manifest-path clients/windows/Cargo.toml
      - name: Windows clippy
        run: cargo clippy --manifest-path clients/windows/Cargo.toml -- -D warnings
      - name: Windows build
        run: cargo build --manifest-path clients/windows/Cargo.toml
