[package]
name = "messk-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[features]
default = []
mesh-prototype = ["dep:libp2p"]

[dependencies]
libp2p = { version = "0.56.0", optional = true, default-features = false, features = [
    "autonat",
    "dcutr",
    "ed25519",
    "gossipsub",
    "identify",
    "kad",
    "macros",
    "noise",
    "relay",
    "tcp",
    "tokio",
    "yamux",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
