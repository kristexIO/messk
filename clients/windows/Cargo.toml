[package]
name = "messk-windows"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
bip39 = { version = "2.2.2", features = ["rand", "zeroize"] }
crypto_box = { version = "0.10.0-pre.0", features = ["std"] }
crypto_secretbox = { version = "0.2.0-pre.0", features = ["std", "salsa20"] }
curve25519-dalek = "5.0.0-pre.1"
eframe = { version = "0.34.2", default-features = false, features = ["default_fonts", "glow"] }
futures-util = "0.3.31"
getrandom = "0.3.4"
hkdf = "0.12.4"
hmac = "0.12.1"
messk-core = { path = "../core" }
reqwest = { version = "0.12.25", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rfd = "0.15.4"
rusqlite = { version = "0.37.0", features = ["bundled"] }
salsa20 = "0.11.0-rc.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2.5.7"
uuid = { version = "1.23.1", features = ["v4"] }
winrt-notification = "0.5.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
zeroize = { version = "1.8.2", features = ["derive"] }
cpal = "0.17.3"
hound = "3.5.1"
rodio = { version = "0.22.2", features = ["symphonia-mkv"] }
